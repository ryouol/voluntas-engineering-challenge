[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
default-run = "engineering-challenge"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam = "0.8.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "test-util"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["pem"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
rand = "0.9"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
